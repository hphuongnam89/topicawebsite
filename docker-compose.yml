x-app: &app
  image: topica-edu:local
  build: .
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://topica:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/topica
    DATABASE_SCHEMA: topica_runtime
    ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required on first startup}
  networks: [backend, frontend]

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: topica
      POSTGRES_DB: topica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - topica-postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topica -d topica"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
  schema-migrate:
    <<: *app
    command: ["node", "--conditions=react-server", "dist/migrate-db.mjs"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  web:
    <<: *app
    expose: ["3000"]
    environment:
      <<: *app-env
      TRUSTED_INGRESS: nginx
      NEXT_PUBLIC_SITE_URL: https://topicauni.edu.vn
      WORDPRESS_API_URL: https://topicauni.edu.vn/wp-json/wp/v2
      CMS_REVALIDATE_SECONDS: 300
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
    volumes:
      - topica-uploads:/app/public/uploads
    depends_on:
      schema-migrate: { condition: service_completed_successfully }
    restart: always
  ingress:
    image: nginx:1.28-alpine
    ports: ["3000:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend, backend]
    depends_on: [web]
    restart: always
  lead-worker:
    <<: *app
    command: ["node", "--conditions=react-server", "dist/lead-delivery-worker.mjs", "--watch"]
    depends_on:
      schema-migrate: { condition: service_completed_successfully }
    restart: always
  retention-scheduler:
    <<: *app
    command: ["node", "--conditions=react-server", "dist/retention-scheduler.mjs"]
    environment:
      <<: *app-env
      LEAD_RETENTION_DAYS: ${LEAD_RETENTION_DAYS:?LEAD_RETENTION_DAYS is required}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:?ANALYTICS_RETENTION_DAYS is required}
      RETENTION_ALERT_WEBHOOK: ${RETENTION_ALERT_WEBHOOK:-}
      RETENTION_AUDIT_LOG: ${RETENTION_AUDIT_LOG:-/app/data/retention-audit.jsonl}
    volumes:
      - topica-runtime-data:/app/data
    depends_on:
      schema-migrate: { condition: service_completed_successfully }
    restart: always

networks:
  frontend:
  backend:
    internal: true

volumes:
  topica-postgres:
  topica-uploads:
  topica-runtime-data:
