name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: topica_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d topica_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/topica_test
          ADMIN_INITIAL_PASSWORD: ci-only-password-12345
          ADMIN_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --json > audit-full.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-full.json
      - run: docker build --target runner -t topica-edu:ci .
